<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>バイタル精神状態おみくじ（研究データ収集・完全自立モード）</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent-color: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --text-color: #f8fafc;
      --warn-bg: rgba(245, 158, 11, 0.15);
      --warn-border: rgba(245, 158, 11, 0.5);
      --warn-text: #fcd34d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: var(--card-bg);
      border-radius: 24px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-align: center;
      position: relative;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 6px;
      letter-spacing: 2px;
      color: #e2e8f0;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* 管理者用初期接続ボタン（接続後は目立たなくする） */
    .btn {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      border: none;
      padding: 12px 28px;
      font-size: 0.95rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
      transition: all 0.3s ease;
      margin-bottom: 20px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
    }
    .btn.connected {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #334155;
      color: #64748b;
      font-size: 0.75rem;
      padding: 6px 16px;
      box-shadow: none;
      cursor: default;
      transform: none;
    }

    /* 画面切り替えセクション */
    .view-section {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 290px;
    }
    .view-section.active {
      display: flex;
    }

    /* 指を離さないよう促す強調バナー */
    .keep-finger-banner {
      background: var(--warn-bg);
      border: 1px solid var(--warn-border);
      color: var(--warn-text);
      padding: 10px 18px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      margin-top: 16px;
      animation: pulseBorder 1.5s infinite ease-in-out;
    }
    @keyframes pulseBorder {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    /* 1. 待機中アニメーション */
    .pulse-ring {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(139, 92, 246, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.8rem;
      animation: waitingPulse 2s infinite ease-in-out;
      margin-bottom: 18px;
    }
    @keyframes waitingPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 0 22px rgba(139, 92, 246, 0); }
    }

    /* 2. 計測中アニメーション (10秒カウント) */
    .progress-circle {
      position: relative;
      width: 140px;
      height: 140px;
      margin-bottom: 14px;
    }
    .progress-circle svg {
      width: 140px;
      height: 140px;
      transform: rotate(-90deg);
    }
    .progress-circle circle {
      fill: none;
      stroke-width: 8;
      stroke-linecap: round;
    }
    .circle-bg { stroke: #334155; }
    .circle-bar {
      stroke: #ec4899;
      stroke-dasharray: 408;
      stroke-dashoffset: 408;
      transition: stroke-dashoffset 1s linear;
    }
    .timer-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 2.2rem;
      font-weight: bold;
      color: #f472b6;
    }
    .bpm-live {
      font-size: 1.1rem;
      color: #cbd5e1;
      margin-top: 4px;
    }
    .bpm-val {
      font-size: 1.7rem;
      font-weight: bold;
      color: #38bdf8;
    }

    /* 3. おみくじシャッフルアニメーション */
    .omikuji-box {
      width: 74px;
      height: 126px;
      background: linear-gradient(135deg, #dc2626, #991b1b);
      border-radius: 12px 12px 6px 6px;
      border: 3px solid #fef08a;
      position: relative;
      margin-bottom: 18px;
      box-shadow: 0 10px 25px rgba(220, 38, 38, 0.4);
    }
    .omikuji-box::before {
      content: '御神籤';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fef08a;
      font-weight: bold;
      writing-mode: vertical-rl;
      font-size: 1.15rem;
      letter-spacing: 4px;
    }
    .shaking {
      animation: shakeBox 0.5s infinite ease-in-out;
    }
    @keyframes shakeBox {
      0%, 100% { transform: rotate(0deg) translateY(0); }
      25% { transform: rotate(-12deg) translateY(-8px); }
      75% { transform: rotate(12deg) translateY(-8px); }
    }

    /* 4. 運勢結果表示 */
    .result-card {
      animation: revealResult 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      width: 100%;
    }
    @keyframes revealResult {
      0% { opacity: 0; transform: scale(0.85) translateY(20px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .fortune-rank {
      font-size: 3.4rem;
      font-weight: 900;
      margin: 8px 0;
      background: linear-gradient(135deg, #fef08a, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(245, 158, 11, 0.3);
    }
    .avg-bpm-badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.15);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.3);
      padding: 4px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-bottom: 8px;
    }
    .fortune-desc {
      font-size: 0.95rem;
      line-height: 1.65;
      color: #e2e8f0;
      background: rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      text-align: left;
    }

    /* 自動リセットカウントダウン表示 */
    .auto-reset-box {
      background: rgba(148, 163, 184, 0.1);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      color: #cbd5e1;
    }
    .auto-reset-sec {
      font-weight: bold;
      color: #38bdf8;
      font-size: 1.05rem;
    }

    .status-text {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>精神状態 占術デバイス</h1>
  <p class="subtitle">MAX30102 バイタル波形連動システム</p>

  <!-- 展示開始時に管理者が1回だけ押す接続ボタン -->
  <button id="connectBtn" class="btn">デバイスに接続 (COM)</button>

  <!-- STATE 1: 待機中 (無人自動待機) -->
  <div id="idleView" class="view-section active">
    <div class="pulse-ring" id="idleIcon">❤️</div>
    <p id="idleMainText" style="font-size: 1.15rem; font-weight: bold; color: #f1f5f9;">センサーに指をそっと乗せてください</p>
    <p id="idleSubText" class="status-text">心拍（BPM）を検知すると自動で計測が始まります</p>
  </div>

  <!-- STATE 2: 10秒計測中 -->
  <div id="measuringView" class="view-section">
    <div class="progress-circle">
      <svg>
        <circle class="circle-bg" cx="70" cy="70" r="65"></circle>
        <circle id="progressBar" class="circle-bar" cx="70" cy="70" r="65"></circle>
      </svg>
      <div id="countdownText" class="timer-text">10</div>
    </div>
    <div class="bpm-live">リアルタイム心拍: <span id="liveBpm" class="bpm-val">--</span> BPM</div>
    <div class="keep-finger-banner">⚠️ 結果が出るまで指を離さないでください</div>
  </div>

  <!-- STATE 3: おみくじアニメーション -->
  <div id="drawingView" class="view-section">
    <div id="omikujiBox" class="omikuji-box shaking"></div>
    <p style="font-size: 1.15rem; font-weight: bold; color: #fef08a;">運勢を抽出中...</p>
    <div class="keep-finger-banner">⚠️ 結果が出るまで、まだ指を離さないでください</div>
  </div>

  <!-- STATE 4: 結果表示 (10秒後に自動で待機画面へ戻る) -->
  <div id="resultView" class="view-section">
    <div class="result-card">
      <div class="avg-bpm-badge">平均心拍数: <span id="resBpm">0</span> BPM</div>
      <div id="resRank" class="fortune-rank">大吉</div>
      <div id="resDesc" class="fortune-desc">説明テキスト</div>
      <div class="auto-reset-box">
        センサーから手を離してください<br>
        あと <span id="resetCountdown" class="auto-reset-sec">10</span> 秒で自動的に最初の画面に戻ります
      </div>
    </div>
  </div>
</div>

<script>
  // =========================================================================
  // 【設定箇所】Google Apps Script (GAS) のウェブアプリURLをここに貼り付けます
  // =========================================================================
  const GAS_URL = "";

  let port, reader;
  let currentState = 'IDLE'; // IDLE, MEASURING, DRAWING, RESULT, ERROR_WAIT
  let bpmSamples = [];
  let countdownTimer = null;
  let resetTimer = null;
  let remainingSeconds = 10;

  // 連続誤検知防止用フラグ（前の人が指を離すまで次の計測を始めない）
  let waitForFingerRelease = false;
  // 計測中の瞬間的な0検知（ノイズ）を許容するためのカウンター
  let zeroStreak = 0;

  const connectBtn = document.getElementById('connectBtn');
  const idleView = document.getElementById('idleView');
  const measuringView = document.getElementById('measuringView');
  const drawingView = document.getElementById('drawingView');
  const resultView = document.getElementById('resultView');

  const idleIcon = document.getElementById('idleIcon');
  const idleMainText = document.getElementById('idleMainText');
  const idleSubText = document.getElementById('idleSubText');

  const liveBpmEl = document.getElementById('liveBpm');
  const countdownText = document.getElementById('countdownText');
  const progressBar = document.getElementById('progressBar');

  const resBpm = document.getElementById('resBpm');
  const resRank = document.getElementById('resRank');
  const resDesc = document.getElementById('resDesc');
  const resetCountdownEl = document.getElementById('resetCountdown');

  // Web Serial 接続処理（展示開始時に1回だけ操作）
  connectBtn.addEventListener('click', async () => {
    try {
      port = await navigator.serial.requestPort();
      await port.open({ baudRate: 9600 });
      connectBtn.disabled = true;
      connectBtn.classList.add('connected');
      connectBtn.innerText = "● 自動展示モード稼働中 (9600 baud)";
      readSerialData();
    } catch (err) {
      console.error("シリアルポート接続エラー:", err);
    }
  });

  // シリアルデータ読み取りループ
  async function readSerialData() {
    const textDecoder = new TextDecoderStream();
    const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
    reader = textDecoder.readable.getReader();
    let buffer = '';

    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += value;
      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        const bpm = parseInt(line.trim(), 10);
        if (!isNaN(bpm)) {
          handleBpmInput(bpm);
        }
      }
    }
  }

  // 入力BPMに基づく完全自動状態管理
  function handleBpmInput(bpm) {
    if (currentState === 'IDLE') {
      if (waitForFingerRelease) {
        if (bpm === 0) {
          waitForFingerRelease = false;
          resetIdleText();
        }
      } else {
        if (bpm > 0) {
          startMeasurement();
        }
      }
    } else if (currentState === 'MEASURING') {
      if (bpm === 0) {
        zeroStreak++;
        if (zeroStreak >= 2) {
          cancelMeasurementAuto();
        }
      } else {
        zeroStreak = 0;
        bpmSamples.push(bpm);
        liveBpmEl.innerText = bpm;
      }
    } else if (currentState === 'DRAWING') {
      if (bpm === 0) {
        zeroStreak++;
        if (zeroStreak >= 2) {
          cancelMeasurementAuto();
        }
      } else {
        zeroStreak = 0;
      }
    }
  }

  // 待機画面のテキストを通常に戻す
  function resetIdleText() {
    idleIcon.innerText = "❤️";
    idleMainText.innerText = "センサーに指をそっと乗せてください";
    idleMainText.style.color = "#f1f5f9";
    idleSubText.innerText = "心拍（BPM）を検知すると自動で計測が始まります";
  }

  // 10秒間の計測開始
  function startMeasurement() {
    currentState = 'MEASURING';
    bpmSamples = [];
    zeroStreak = 0;
    remainingSeconds = 10;
    liveBpmEl.innerText = "--";
    
    switchView(measuringView);
    updateProgress(10);

    countdownTimer = setInterval(() => {
      remainingSeconds--;
      updateProgress(remainingSeconds);

      if (remainingSeconds <= 0) {
        clearInterval(countdownTimer);
        triggerOmikujiDraw();
      }
    }, 1000);
  }

  // 途中で指が外れた場合の完全自動リセット
  function cancelMeasurementAuto() {
    clearInterval(countdownTimer);
    currentState = 'ERROR_WAIT';
    
    idleIcon.innerText = "⚠️";
    idleMainText.innerText = "途中で指が離れました！";
    idleMainText.style.color = "#f87171";
    idleSubText.innerText = "結果が出るまで指を乗せたままにしてください（自動で戻ります）";
    switchView(idleView);

    setTimeout(() => {
      waitForFingerRelease = false;
      currentState = 'IDLE';
      resetIdleText();
    }, 2500);
  }

  // プログレスバー更新
  function updateProgress(sec) {
    countdownText.innerText = sec;
    const maxOffset = 408;
    const progress = (10 - sec) / 10;
    progressBar.style.strokeDashoffset = maxOffset * (1 - progress);
  }

  // 配列の平均値を計算するヘルパー（小数点第1位まで）
  function calcMean(arr) {
    if (!arr || arr.length === 0) return 0;
    const sum = arr.reduce((a, b) => a + b, 0);
    return Math.round((sum / arr.length) * 10) / 10;
  }

  // おみくじ抽選アニメーション (2.5秒間) & 統計データ集計
  function triggerOmikujiDraw() {
    currentState = 'DRAWING';
    switchView(drawingView);

    const sampleCount = bpmSamples.length;
    let avgBpmExact = 72.0;
    let firstHalfBpm = 72.0;
    let secondHalfBpm = 72.0;

    if (sampleCount >= 2) {
      avgBpmExact = calcMean(bpmSamples);
      const mid = Math.floor(sampleCount / 2);
      const firstHalf = bpmSamples.slice(0, mid);
      const secondHalf = bpmSamples.slice(sampleCount - mid);
      firstHalfBpm = calcMean(firstHalf);
      secondHalfBpm = calcMean(secondHalf);
    } else if (sampleCount === 1) {
      avgBpmExact = bpmSamples[0];
      firstHalfBpm = bpmSamples[0];
      secondHalfBpm = bpmSamples[0];
    }

    // 画面表示・おみくじ判定用の整数BPM
    const displayAvgBpm = Math.round(avgBpmExact);
    // 前後変化量（後半 - 前半：マイナスなら計測中に心拍が落ち着いたことを示す）
    const diffBpm = Math.round((secondHalfBpm - firstHalfBpm) * 10) / 10;

    const statsData = {
      avgBpm: avgBpmExact,
      displayBpm: displayAvgBpm,
      firstHalfBpm: firstHalfBpm,
      secondHalfBpm: secondHalfBpm,
      diffBpm: diffBpm,
      sampleCount: sampleCount
    };

    setTimeout(() => {
      if (currentState === 'DRAWING') {
        showResult(statsData);
      }
    }, 2500);
  }

  // 運勢判定・結果表示 ＆ 10秒後に自動で最初の画面へ戻る
  function showResult(stats) {
    currentState = 'RESULT';
    const avgBpm = stats.displayBpm;
    resBpm.innerText = avgBpm;

    let rank = "";
    let desc = "";

    if (avgBpm < 62) {
      rank = "養生吉";
      desc = "【静寂・エネルギー充電期】<br>心拍がとても穏やかで、心身が「お休み・回復モード」に入っています。今は無理にアクセルを踏むよりも、温かい飲み物を飲んだり早めに休んだりしてエネルギーを蓄えることで、運気が大きく花開きます。（※スポーツ習慣がある人は心肺機能が高い証拠でもあります！）";
    } else if (avgBpm >= 62 && avgBpm <= 78) {
      rank = "大 吉";
      desc = "【完全調和・直感冴える】<br>自律神経のバランスが完璧です！心身ともにクリアでブレのない状態。今思いついたアイデアを実行に移すと最高の成果が得られます。";
    } else if (avgBpm >= 79 && avgBpm <= 88) {
      rank = "中 吉";
      desc = "【情熱・エネルギー高揚】<br>脈拍にポジティブな高鳴りが見られます。モチベーションが高まっているタイミングです。この勢いに乗って一気にやり残した課題を終わらせましょう！";
    } else {
      rank = "波乱吉";
      desc = "【高揚・交感神経フル稼働】<br>心拍が速くなっており、脳と体が「戦闘・集中モード」に入っています！エネルギーが満ち溢れているサインですが、少し力みすぎているかも。まずは鼻から吸って口から長く吐く深呼吸を3回すると、波乱が味方に変わります。";
    }

    resRank.innerText = rank;
    resDesc.innerHTML = desc;
    switchView(resultView);

    // スプレッドシートへ研究用統計データを送信
    sendToSpreadsheet(stats, rank);

    // 10秒カウントダウンして自動で最初の待機画面に戻る
    let resetSec = 10;
    resetCountdownEl.innerText = resetSec;

    resetTimer = setInterval(() => {
      resetSec--;
      resetCountdownEl.innerText = resetSec;

      if (resetSec <= 0) {
        clearInterval(resetTimer);
        returnToIdleAutomatically();
      }
    }, 1000);
  }

  // 結果表示から最初の画面へ自動復帰する処理
  function returnToIdleAutomatically() {
    currentState = 'IDLE';
    waitForFingerRelease = true;
    idleIcon.innerText = "✋";
    idleMainText.innerText = "一度センサーから指を離してください";
    idleMainText.style.color = "#fcd34d";
    idleSubText.innerText = "指を離すと次の人の計測準備が整います";
    switchView(idleView);

    setTimeout(() => {
      if (currentState === 'IDLE' && waitForFingerRelease) {
        waitForFingerRelease = false;
        resetIdleText();
      }
    }, 3000);
  }

  // スプレッドシート送信関数（全体平均・前半・後半・変化量・運勢・有効データ数）
  function sendToSpreadsheet(stats, rank) {
    if (!GAS_URL || !GAS_URL.startsWith("https://")) return;

    fetch(GAS_URL, {
      method: "POST",
      mode: "no-cors",
      body: JSON.stringify({
        avgBpm: stats.avgBpm,
        firstHalfBpm: stats.firstHalfBpm,
        secondHalfBpm: stats.secondHalfBpm,
        diffBpm: stats.diffBpm,
        rank: rank,
        sampleCount: stats.sampleCount
      })
    }).catch(err => console.error("スプレッドシート送信エラー:", err));
  }

  // ビュー切り替えヘルパー
  function switchView(targetView) {
    [idleView, measuringView, drawingView, resultView].forEach(v => v.classList.remove('active'));
    targetView.classList.add('active');
  }
</script>

</body>
</html>
